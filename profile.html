<main class="container">

  <div class="panel">

    <!-- TOP BAR -->
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div class="hero-top">USER PROFILE</div>

      <button onclick="toggleEdit()" id="editBtn">
        Edit Profile
      </button>
    </div>

    <!-- PROFILE CARD -->
    <div class="profile-card">

      <img id="pfp" class="profile-pfp">

      <div style="flex:1">

        <h1 id="displayName"></h1>
        <div id="displayPosition" class="profile-position"></div>
        <div id="displayCountry"></div>

      </div>

    </div>

    <!-- SOCIALS -->
    <div id="socialsView" class="profile-socials"></div>

    <!-- MUSIC -->
    <div id="musicView"></div>

    <!-- STATS -->
    <div class="profile-stats" id="stats"></div>

    <!-- EDIT MODE -->
    <div id="editPanel" style="display:none;margin-top:20px">

      <label>Username</label>
      <input id="username">

      <label>Position</label>
      <select id="position">
        <option value="">Select position</option>
        <option>GK</option>
        <option>CB</option>
        <option>LB</option>
        <option>RB</option>
        <option>CM</option>
        <option>CAM</option>
        <option>ST</option>
        <option>LW</option>
        <option>RW</option>
      </select>

      <label>Country</label>
      <input id="country" placeholder="England">

      <label>Discord</label>
      <input id="discord">

      <label>Twitter</label>
      <input id="twitter">

      <label>Instagram</label>
      <input id="instagram">

      <label>TikTok</label>
      <input id="tiktok">

      <label>Music (Spotify/YouTube link)</label>
      <input id="music">

      <button onclick="saveProfile()">Save</button>

    </div>

  </div>

</main>
