<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HMBL | Profile</title>

  <!-- REQUIRED CSS -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="profile.css">

</head>

<body>

<div class="bg-glow" id="glow"></div>

<!-- NAV (simple version) -->
<header class="nav">

  <div class="logo">
    <img src="assets/logo.png" class="logo-img">
  </div>

  <nav class="links">
    <button onclick="window.location.href='/'">Home</button>
  </nav>

</header>

<!-- MAIN -->
<main class="container">

  <div class="profile-editor">

    <!-- LEFT SIDE -->
    <div class="editor-sidebar">

      <div class="sidebar-header">
        <h2>Edit Profile</h2>
        <p>Customize your HMBL identity.</p>
      </div>

      <div class="editor-group">
        <label>Username</label>
        <input id="username" placeholder="Username">
      </div>

      <div class="editor-group">
        <label>Position</label>

        <select id="position">
          <option value="">Select position</option>
          <option>GK</option>
          <option>CB</option>
          <option>LB</option>
          <option>RB</option>
          <option>CM</option>
          <option>CAM</option>
          <option>ST</option>
          <option>LW</option>
          <option>RW</option>
        </select>
      </div>

      <div class="editor-group">
        <label>Country</label>
        <input id="country" placeholder="Country">
      </div>

      <div class="editor-group">
        <label>Twitter</label>
        <input id="twitter" placeholder="@username">
      </div>

      <div class="editor-group">
        <label>Instagram</label>
        <input id="instagram" placeholder="@username">
      </div>

      <div class="editor-group">
        <label>TikTok</label>
        <input id="tiktok" placeholder="@username">
      </div>

      <div class="editor-group">
        <label>Music Link</label>
        <input id="music" placeholder="Spotify / YouTube">
      </div>

      <button onclick="saveProfile()" class="save-btn">
        Save Profile
      </button>

    </div>

    <!-- RIGHT SIDE -->
    <div class="profile-preview">

      <div class="preview-banner"></div>

      <div class="preview-card">

        <img id="pfp" class="preview-avatar">

        <div class="preview-info">

          <h1 id="displayName">Username</h1>

          <div class="preview-tags">
            <span id="displayPosition" class="preview-tag">
              Position
            </span>

            <span id="displayCountry" class="preview-tag">
              Country
            </span>
          </div>

          <div id="socialsView" class="preview-socials"></div>

          <div id="musicView" class="preview-music"></div>

        </div>

      </div>

      <div class="stats-grid" id="stats"></div>

    </div>

  </div>

</main>

<!-- SCRIPTS -->
<script src="config.js"></script>
<script src="auth-state.js"></script>
<script src="profile.js"></script>

</body>
</html>
