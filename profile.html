<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HMBL | Profile Setup</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="bg-glow" id="glow"></div>

  <!-- NAV -->
  <header class="nav">

    <div class="logo">
      <img src="assets/logo.png" class="logo-img">
    </div>

    <nav class="links">
      <button onclick="window.location.href='/'">Home</button>
      <button onclick="window.location.href='/profile.html'">Profile</button>
    </nav>

  </header>

  <!-- MAIN -->
  <main class="container">

    <div class="panel">

      <div class="hero-top">PROFILE SETUP</div>

      <h1 id="title">Complete Your Profile</h1>

      <p style="opacity:0.7;margin-top:-10px">
        Set your identity for the HMBL system
      </p>

      <!-- CARD -->
      <div class="profile-card">

        <img id="pfp" class="profile-pfp" alt="Discord PFP">

        <div class="profile-form">

          <label>Username</label>
          <input id="username" type="text" placeholder="Your username">

          <label>Position</label>
          <input id="position" type="text" placeholder="ST, CM, GK">

        </div>

      </div>

      <!-- BUTTONS -->
      <div class="profile-buttons">

        <button onclick="saveProfile()">
          Save Profile
        </button>

        <button onclick="skipProfile()" id="skipBtn">
          Skip
        </button>

      </div>

    </div>

  </main>

  <script src="config.js"></script>
  <script src="auth-state.js"></script>
  <script src="profile.js"></script>

</body>
</html>
