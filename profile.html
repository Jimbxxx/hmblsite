<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HMBL | Edit Profile</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="profile.css">
</head>

<body>

<div class="bg-glow" id="glow"></div>

<header class="nav">

  <div class="logo">
    <img src="assets/logo.png" class="logo-img">
  </div>

  <nav class="links">
    <button onclick="window.location.href='/'">
      Home
    </button>
  </nav>

</header>

<main class="container">

  <div class="profile-layout">

    <!-- EDIT SIDEBAR -->
    <div class="editor-sidebar">

      <div class="sidebar-header">
        <h2>Edit Profile</h2>
        <p>Your public HMBL profile.</p>
      </div>

      <div class="editor-group">
        <label>Username</label>
        <input id="username">
      </div>

      <div class="editor-group">
        <label>Position</label>

        <select id="position">
          <option value="">Select position</option>
          <option>GK</option>
          <option>CB</option>
          <option>LB</option>
          <option>RB</option>
          <option>CM</option>
          <option>CAM</option>
          <option>ST</option>
          <option>LW</option>
          <option>RW</option>
        </select>
      </div>

      <div class="editor-group">
        <label>Country</label>
        <input id="country">
      </div>

      <div class="editor-group">
        <label>Twitter</label>
        <input id="twitter">
      </div>

      <div class="editor-group">
        <label>Instagram</label>
        <input id="instagram">
      </div>

      <div class="editor-group">
        <label>TikTok</label>
        <input id="tiktok">
      </div>

      <div class="editor-group">
        <label>Music Link</label>
        <input id="music">
      </div>

      <button class="save-btn" onclick="saveProfile()">
        Save Profile
      </button>

    </div>

    <!-- REAL PROFILE -->
    <div class="profile-panel">

      <div id="profile">

        <h2>Loading profile...</h2>

      </div>

    </div>

  </div>

</main>

<script src="config.js"></script>
<script src="auth-state.js"></script>
<script src="profile.js"></script>

</body>
</html>
