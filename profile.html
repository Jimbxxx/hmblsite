<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HMBL | Profile</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- glow -->
  <div class="bg-glow" id="glow"></div>

  <!-- NAV -->
  <header class="nav">

    <div class="logo">
      <img src="assets/logo.png" class="logo-img" alt="HMBL">
    </div>

    <nav class="links">

      <button onclick="window.location.href='/'">Home</button>

      <button onclick="window.location.href='/profile.html'">
        Profile
      </button>

      <button id="logoutBtn" onclick="logout()" style="display:none">
        Logout
      </button>

    </nav>

  </header>

  <!-- MAIN -->
  <main class="container">

    <div class="panel hero">

      <div class="hero-top">PROFILE SYSTEM</div>

      <h1 id="title">Complete Your Profile</h1>

      <p>Update your player identity for HMBL.</p>

      <!-- PROFILE CARD -->
      <div class="profile-card">

        <img id="pfp" class="profile-pfp" alt="pfp">

        <div class="profile-form">

          <div class="field">
            <span class="label">Username</span>
            <input id="username" type="text" placeholder="Enter username">
          </div>

          <div class="field">
            <span class="label">Position</span>
            <input id="position" type="text" placeholder="ST, CM, GK">
          </div>

        </div>

      </div>

      <!-- STATUS -->
      <div class="profile-status" id="status"></div>

      <!-- BUTTONS -->
      <div class="profile-buttons">

        <button onclick="saveProfile()">Save</button>
        <button id="skipBtn" onclick="skipProfile()">Skip</button>

      </div>

    </div>

  </main>

  <!-- SCRIPTS -->
  <script src="config.js"></script>
  <script src="auth-state.js"></script>
  <script src="profile.js"></script>

</body>
</html>
