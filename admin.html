<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HMBL Admin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="admin-wrapper">

  <div class="admin-header">
    <h1>ADMIN DASHBOARD</h1>
    <p>System Control Panel</p>
  </div>

  <div class="admin-grid">

    <button class="admin-card owner">
      <h2>Owner Panel</h2>
      <p>Full system control</p>
    </button>

    <button class="admin-card admin">
      <h2>Admin Panel</h2>
      <p>User & system management</p>
    </button>

    <button class="admin-card overseer">
      <h2>Overseer Panel</h2>
      <p>Monitoring & moderation</p>
    </button>

    <button class="admin-card staff">
      <h2>Staff Panel</h2>
      <p>Basic staff tools</p>
    </button>

  </div>

</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="admin.js"></script>
<script src="admin-page.js"></script>

</body>
</html>
