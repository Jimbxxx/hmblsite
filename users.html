<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile - HMBL</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="panel" id="profile">

    <h2>Loading profile...</h2>

  </div>

</div>

<script src="config.js"></script>
<script src="auth.js"></script>

<script>
const API = CONFIG.API_BASE;

// ================= GET USER FROM URL =================
function getUsernameFromURL() {
  const params = new URLSearchParams(window.location.search);
  return params.get("u");
}

// ================= LOAD PROFILE =================
async function loadProfile() {

  const username = getUsernameFromURL();

  if (!username) {
    document.getElementById("profile").innerHTML = "<h2>User not found</h2>";
    return;
  }

  try {
    const res = await fetch(`${API}/players`);
    const json = await res.json();

    const players = Object.values(json.data || {});
    const user = players.find(p => p.username === username);

    if (!user) {
      document.getElementById("profile").innerHTML = "<h2>User not found</h2>";
      return;
    }

    renderProfile(user);

    // optional: increase profile views
    fetch(`${API}/players/increment-view`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username })
    });

  } catch (err) {
    console.log(err);
    document.getElementById("profile").innerHTML = "<h2>Error loading profile</h2>";
  }
}

// ================= RENDER =================
function renderProfile(user) {

  const isOwner =
    getCurrentUser() &&
    getCurrentUser().username === user.username;

  document.getElementById("profile").innerHTML = `
    <div style="display:flex;gap:20px;align-items:center;">

      <img src="${user.pfp || ''}" style="width:80px;height:80px;border-radius:50%;background:#111;" />

      <div>
        <h2>${user.username}</h2>
        <p>${user.position || "No position set"}</p>
      </div>

    </div>

    <hr style="margin:20px 0;opacity:0.1">

    <div>
      <p>Goals: ${user.goals}</p>
      <p>Assists: ${user.assists}</p>
      <p>Points: ${user.points}</p>
      <p>Clean Sheets: ${user.clean_sheets}</p>
      <p>Profile Views: ${user.profile_views}</p>
    </div>

    ${isOwner ? `
      <button onclick="editProfile()">Edit Profile</button>
    ` : ""}
  `;
}

// ================= EDIT BUTTON =================
function editProfile() {
  alert("We’ll build edit system next (same setup page system).");
}

// start
loadProfile();
</script>

</body>
</html>
