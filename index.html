<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HMBL</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="nav">
  <div class="logo">HMBL</div>

  <input id="search" class="search" placeholder="Search teams, players..." />

  <nav class="links">
    <button onclick="showTab('home')">Home</button>
    <button onclick="showTab('leaderboard')">Leaderboard</button>
    <button onclick="showTab('teams')">Teams</button>
    <button onclick="showTab('games')">Recent Games</button>
    <button onclick="showTab('tables')">Tables</button>
  </nav>
</header>

<main class="container">

  <!-- HOME -->
  <section id="home" class="tab active">
    <div class="panel">
      <h1>HMBL Dashboard</h1>
      <p>Live league system with teams, stats and matches.</p>
    </div>
  </section>

  <!-- LEADERBOARD -->
  <section id="leaderboard" class="tab">
    <div class="panel">
      <h2>Leaderboard</h2>
      <p class="muted">Placeholder: /leaderboard API coming soon</p>
    </div>
  </section>

  <!-- TEAMS -->
  <section id="teams" class="tab">
    <div class="panel">

      <h2>Teams</h2>

      <div id="teamsList"></div>

    </div>
  </section>

  <!-- GAMES -->
  <section id="games" class="tab">
    <div class="panel">
      <h2>Recent Games</h2>
      <p class="muted">Placeholder: /matches API coming soon</p>
    </div>
  </section>

  <!-- TABLES -->
  <section id="tables" class="tab">
    <div class="panel">

      <h2>Divisions Table</h2>

      <div id="divisionsList"></div>

    </div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
